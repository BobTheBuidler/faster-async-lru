name: CodSpeed Benchmarks

on:
  push:
    branches:
      - master
      - '[0-9].[0-9]+'
      - compile
    paths:
      - '**/*.py'
      - '.github/workflows/codspeed.yml'
      - 'pytest-benchmark.ini'
      - 'pytest-codspeed.ini'
      - 'pyproject.toml'
      - 'setup.py'
      - 'setup.cfg'
      - 'tox.ini'
      - 'requirements*.txt'
  pull_request:
    branches:
      - master
      - '[0-9].[0-9]+'
      - compile
    paths:
      - '**/*.py'
      - '.github/workflows/codspeed.yml'
      - 'pytest-benchmark.ini'
      - 'pytest-codspeed.ini'
      - 'pyproject.toml'
      - 'setup.py'
      - 'setup.cfg'
      - 'tox.ini'
      - 'requirements*.txt'
  workflow_dispatch:

jobs:
  benchmark:
    name: Run CodSpeed Benchmarks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: |
            **/requirements*.txt
            pyproject.toml
            setup.cfg
            setup.py
            tox.ini

      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          mode: instrumentation
          run: tox -e codspeed
          token: ${{ secrets.CODSPEED_TOKEN }}
